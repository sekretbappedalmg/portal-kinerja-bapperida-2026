<style>
:root{
  --bg:#eef3f6; --surface:#ffffff; --surface-2:#f5f8fa; --ink:#0f2a43; --ink-2:#4d6379; --line:#d7e1e9;
  --sea:#0e7c86; --sea-ink:#0a5a62; --sea-soft:#def1f2;
  --sun:#e3a008; --sun-soft:#fcf0cc;
  --coral:#d4453c; --coral-soft:#fde5e2;
  --leaf:#1f9a63; --leaf-soft:#dbf3e6;
  --rail:#0f2a43; --rail-ink:#d6e4ef; --rail-mute:#8ba5bb; --rail-line:#24435f;
  --focus:#0e7c86; --shadow:0 1px 2px rgba(15,42,67,.06),0 8px 24px -12px rgba(15,42,67,.18);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1826; --surface:#11283b; --surface-2:#0e2132; --ink:#e7eff6; --ink-2:#9fb4c7; --line:#25415a;
    --sea:#3fc4ce; --sea-ink:#86e0e6; --sea-soft:#0f3b43; --sun:#f3c04f; --sun-soft:#3a3116;
    --coral:#ff7d74; --coral-soft:#3d2022; --leaf:#4fd18f; --leaf-soft:#123a2a;
    --rail:#07121e; --rail-line:#1b3349; --focus:#3fc4ce; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1826; --surface:#11283b; --surface-2:#0e2132; --ink:#e7eff6; --ink-2:#9fb4c7; --line:#25415a;
  --sea:#3fc4ce; --sea-ink:#86e0e6; --sea-soft:#0f3b43; --sun:#f3c04f; --sun-soft:#3a3116;
  --coral:#ff7d74; --coral-soft:#3d2022; --leaf:#4fd18f; --leaf-soft:#123a2a;
  --rail:#07121e; --rail-line:#1b3349; --focus:#3fc4ce; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* kerangka */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 16px;position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:22px;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.brand svg{flex:none}
.brand img{flex:none;height:34px;width:auto;object-fit:contain;display:block;align-self:center}
.brand b{font:700 17px/1.15 var(--f-display);display:block;color:#fff}
.brand span{font-size:12.5px;color:var(--rail-mute)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--rail-ink);padding:11px 12px;border-radius:10px;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.nav svg{width:20px;height:20px;flex:none}
.nav .cnt{margin-left:auto;background:var(--sun);color:#3a2a00;font-weight:700;font-size:12px;border-radius:99px;padding:1px 8px}
.who{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--rail-line);border-radius:12px}
.who label{font-size:12.5px;color:var(--rail-mute)}
.who select{background:#0b2035;color:#fff;border:1px solid var(--rail-line);border-radius:8px;padding:9px 10px;width:100%}
.sync{margin-top:auto;font-size:12.5px;color:var(--rail-mute);display:flex;gap:8px;align-items:flex-start;padding:0 6px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--leaf);margin-top:5px;flex:none}
.sync.local i{background:var(--sun)}
.main{padding:26px clamp(16px,3vw,40px) 80px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.top h1{font-size:clamp(24px,3vw,32px);font-weight:800;line-height:1.1}
.top p{margin:6px 0 0;color:var(--ink-2);max-width:60ch}
.per{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);padding:5px;border-radius:14px;box-shadow:var(--shadow)}
.per button{position:relative;border:0;background:none;padding:8px 14px 10px;border-radius:10px;min-width:82px;text-align:left;overflow:hidden}
.per button b{display:block;font:700 15px var(--f-display)}
.per button small{color:var(--ink-2);font-size:12px}
.per button::after{content:"";position:absolute;left:10px;right:10px;bottom:4px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--sea) var(--fill,0%),var(--line) 0)}
.per button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.per button[aria-pressed="true"] small{color:inherit;opacity:.75}
.per button[aria-pressed="true"]::after{background:linear-gradient(90deg,var(--sun) var(--fill,0%),rgba(255,255,255,.25) 0)}

.per .pl{position:relative;padding:8px 18px 14px;min-width:160px;background:var(--ink);color:var(--surface);border-radius:10px;overflow:hidden}
.per .pl b{display:block;font:700 15px var(--f-display)}
.per .pl small{opacity:.78;font-size:12px}
.per .pl::after{content:"";position:absolute;left:14px;right:14px;bottom:5px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--sun) var(--fill,0%),rgba(255,255,255,.25) 0)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.sec{margin-top:26px}
.sec>h2{font-size:20px;font-weight:700;margin-bottom:4px}
.sec>p.sub{margin:0 0 14px;color:var(--ink-2)}

/* ringkasan */
.sum{display:grid;grid-template-columns:auto 1fr;gap:26px;padding:22px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--line)} .ring .val{stroke:var(--sea);transition:stroke-dashoffset .5s}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font:800 30px/1 var(--f-display)} .ring small{color:var(--ink-2);font-size:12px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 26px}
.fig b{display:block;font:800 26px/1.1 var(--f-display)}
.fig span{color:var(--ink-2);font-size:13.5px}
.fig.go{display:flex;align-items:center}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px}
.stat .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;margin-bottom:2px}
.stat .ic svg{width:21px;height:21px}

function predikat(avg){
  if(avg==null) return {label:'Belum ada data', cls:'ink'};
  if(avg>=100) return {label:'Sangat baik', cls:'leaf'};
  if(avg>=75) return {label:'Baik', cls:'sea'};

}

const bidangName = id => (S.cfg.names && S.cfg.names[id]) || (BIDANG0.find(b=>b.id===id)||{}).n || id;
function bidangOf(it){ const m=S.cfg.map||{}; return m[it.k] || (it.l===3 && m[it.kk]) || it.b; }
function rep(k,per){
  const d=S.reports[k]; if(!d) return null;
  if(d.per && d.per[per]) return d.per[per];
  if(d.tw){ for(const t of ['4','3','2','1']) if(d.tw[t]) return d.tw[t]; } /* data uji triwulan lama */
  return null;
}
function bidangList(){ return BIDANG0.filter(b=> b.id!=='lin' || ITEMS.some(x=>bidangOf(x)==='lin')); }
function effInd(it){
  const ov = (S.cfg.targets && S.cfg.targets[it.k]) || [];
  return it.i.map((ind,i)=>{ const o=ov[i]||{}; return { t:ind.t, v:(o.v!=null?o.v:ind.v), u:(o.u!=null&&o.u!==''?o.u:ind.u) }; });
}
function isActive(it){ return effInd(it).every(ind=>(ind.v||0)>0); }
function pctOf(it, r){
  if(!r) return null;
  const eff = effInd(it);
  const ps = eff.map((ind,i)=>{ const v = r.r && r.r[i]; return (v==null||!ind.v) ? 0 : v/ind.v*100; });
  return ps.reduce((a,b)=>a+b,0)/ps.length;
}
function checkPass(x){ return String(x||'')===(S.cfg.pass||DEFAULT_PASS); }
const isSent = r => r && (r.s==='terkirim' || r.s==='terverifikasi');
function statusKey(it,per){ const r=rep(it.k,per); return r ? r.s : 'belum'; }
function stats(list, per){
  let n=0,sent=0,draft=0,ver=0,sum=0,cnt=0,evid=0;
  for(const it of list){
    if(!isActive(it)) continue; n++;
    const r=rep(it.k,per); if(!r) continue;
    if(r.s==='draft'){ draft++; continue; }
    sent++; if(r.s==='terverifikasi') ver++;
    sum+=pctOf(it,r); cnt++;
    if(r.l && r.l.some(l=>l.u)) evid++;
  }
  return {n,sent,draft,ver,avg:cnt?sum/cnt:null,evid,cnt};
}
const activeItems = () => ITEMS.filter(isActive);

/* ---------- persistensi (Google Apps Script + Google Sheet, dengan cadangan lokal) ---------- */
function apiPost(payload){
  return fetch(APPS_SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, /* text/plain menghindari CORS preflight yang tidak didukung Apps Script */
    body: JSON.stringify(Object.assign({secret:API_SECRET}, payload))
  }).then(r=>r.json());
}
async function pullRemote(silent){
  if(!S.remote) return;
  try{
    const res = await fetch(APPS_SCRIPT_URL, {method:'GET', cache:'no-store'});
    const j = await res.json();
    if(!j || j.ok===false) throw new Error(j&&j.error||'gagal mengambil data');
    S.reports = j.reports||{};
    S.cfg = Object.assign({map:{},names:{},targets:{},pass:''}, j.cfg||{});
    S.online = true;
  }catch(e){ S.online = false; if(!silent) console.warn('Gagal terhubung ke Apps Script:', e); }
  S.ready = true; refresh();
}
async function initStore(){
  if(S.remote){
    await pullRemote();
    setInterval(()=>pullRemote(true), REFRESH_MS);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pullRemote(true); });
  } else {
    try{ S.reports = JSON.parse(ls.get('laporan-local','{}'))||{}; S.cfg = JSON.parse(ls.get('cfg-local','{"map":{},"names":{},"targets":{},"pass":""}')); }catch(e){}
    S.ready=true; refresh();
  }
}
async function saveRep(kode, per, r){
  const cur = S.reports[kode] ? clone(S.reports[kode]) : {kode:kode};
  cur.kode = kode; cur.per = cur.per || {};
  delete cur.tw;
  if(r) cur.per[per]=r; else delete cur.per[per];
  S.reports[kode]=cur; refresh();
  if(S.remote){ const res = await apiPost({action:'saveReport', kode, data:cur}); if(!res || res.ok===false) throw new Error(res&&res.error||'gagal menyimpan'); }
  else ls.set('laporan-local', JSON.stringify(S.reports));
}
async function saveCfg(){
  refresh();
  const payload = {map:S.cfg.map, names:S.cfg.names, targets:S.cfg.targets, pass:S.cfg.pass};
  if(S.remote){ const res = await apiPost({action:'saveConfig', data:payload}); if(!res || res.ok===false) throw new Error(res&&res.error||'gagal menyimpan'); }
  else ls.set('cfg-local', JSON.stringify(S.cfg));
}

function downloadText(filename, text){
  const blob = new Blob([text], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),3600);
}

}

/* ---------- dashboard ---------- */
function renderDashboard(){
  const per = S.per; const fb = S.dashBidang;
  const scope = fb==='all' ? activeItems() : activeItems().filter(x=>bidangOf(x)===fb);
  const s = stats(scope,per);
  const offCount = ITEMS.filter(x=>x.l===3 && !isActive(x) && (fb==='all'||bidangOf(x)===fb)).length;
  const bidRows = bidangList().filter(b=>fb==='all'||b.id===fb).map(b=>{
    const list = ITEMS.filter(x=>bidangOf(x)===b.id && x.l===3);
    const bs = stats(list,per); const belum = bs.n-bs.sent-bs.draft;
    return `<tr><td>${esc(bidangName(b.id))}</td><td class="num">${bs.n}</td><td class="num">${bs.sent}</td><td class="num">${bs.draft}</td><td class="num">${belum}</td><td class="num">${bs.ver}</td><td class="num"><b>${fmtPct(bs.avg)}</b></td></tr>`;
  }).join('');
  const progRows = ITEMS.filter(x=>x.l===1 && (fb==='all'||bidangOf(x)===fb)).map(p=>{
    const own = rep(p.k,per); const ownP = own? pctOf(p,own):null;
    const ds = descendants(p.k).map(k=>BY[k]).filter(x=>isActive(x) && x.l===3);
    const st = stats(ds,per);
    return `<tr><td>${esc(p.k)}</td><td style="min-width:220px">${esc(p.n)}</td><td>${esc(bidangName(bidangOf(p)))}</td><td class="num">${own?fmtPct(ownP):'–'}</td><td class="num">${fmtPct(st.avg)}</td><td class="num">${st.sent} / ${st.n}</td></tr>`;
  }).join('');
  const noteItems = ITEMS.filter(x=>isActive(x) && (fb==='all'||bidangOf(x)===fb)).map(it=>({it,r:rep(it.k,per)})).filter(x=>x.r && x.r.vc);
  const notesRows = noteItems.length ? noteItems.map(({it,r})=>`<tr><td>${esc(it.k)}</td><td style="min-width:220px">${esc(it.n)}</td><td>${esc(bidangName(bidangOf(it)))}</td><td style="min-width:260px">${esc(r.vc)}</td><td><span class="pill ${r.s}">${STATUS_LABEL[r.s]}</span></td></tr>`).join('')
    : `<tr><td colspan="5" style="text-align:center;color:var(--ink-2);padding:22px">Belum ada catatan verifikasi dari admin.</td></tr>`;

    <select id="db" aria-label="Filter bidang"><option value="all">Semua bidang</option>${bidangList().map(b=>`<option value="${b.id}" ${fb===b.id?'selected':''}>${esc(bidangName(b.id))}</option>`).join('')}</select>
  </div></div>
  <section class="sec"><h2>Ringkasan per bidang</h2>
    <div class="card tw-wrap"><table class="rk"><thead><tr><th>Bidang</th><th>Sub kegiatan</th><th>Terkirim</th><th>Draft</th><th>Belum</th><th>Terverifikasi</th><th>Rata-rata capaian</th></tr></thead>
    <tbody>${bidRows||'<tr><td colspan="7" style="text-align:center;color:var(--ink-2);padding:22px">Tidak ada data.</td></tr>'}</tbody><tfoot><tr class="l1"><td>Total</td><td class="num">${s.n}</td><td class="num">${s.sent}</td><td class="num">${s.draft}</td><td class="num">${s.n-s.sent-s.draft}</td><td class="num">${s.ver}</td><td class="num">${fmtPct(s.avg)}</td></tr></tfoot></table></div>
    ${offCount?`<p class="note" style="margin-top:8px">${offCount} sub kegiatan bertarget 0 tidak ditampilkan (dapat diaktifkan melalui menu Admin → Target &amp; satuan).</p>`:''}

/* ---------- pelaporan (daftar) ---------- */
function matchItem(it){
  if(S.bidang!=='all' && bidangOf(it)!==S.bidang) return false;
  if(S.st!=='all'){ const k=statusKey(it,S.per); if(!isActive(it)) return false; if(S.st==='belum'){ if(k!=='belum') return false; } else if(k!==S.st) return false; }
  if(S.q){ const q=S.q.toLowerCase(); const hay=(it.k+' '+it.n+' '+it.i.map(i=>i.t).join(' ')).toLowerCase(); if(hay.indexOf(q)<0) return false; }
  return true;
}
function visibleSet(){
  const ok = new Set(ITEMS.filter(matchItem).map(x=>x.k));
  const show = new Set(ok);
  ITEMS.forEach(x=>{ if(ok.has(x.k)){ if(x.l>=2) show.add(x.pk); if(x.l===3) show.add(x.kk); } });
  return {ok,show};
}
function rowHTML(it){
  const r = rep(it.k,S.per); const st = r?r.s:'belum'; const p = pctOf(it,r); const b = band(p);
  const tg = effInd(it).map(tgtText).join(' · ');
  const nl = r && r.l ? r.l.filter(l=>l.u).length : 0;
  const cls = it.l===3 ? 'row sub' : 'row';
  if(!isActive(it)) return `<div class="${cls} off"><div class="nm"><b>${esc(it.n)}</b><small>${esc(it.k)} · target 0, tidak dilaporkan (aktifkan lewat Admin)</small></div></div>`;
  const prog = r
    ? `<b>${fmtPct(p)}</b><div class="bar"><i class="${b}" style="width:${Math.min(100,p)}%"></i></div><span class="note">${nl?nl+' bukti dukung':'Belum ada bukti dukung'}</span>`
    : `<span class="note">Belum ada laporan</span>`;
  return `<div class="${cls}" role="button" tabindex="0" data-act="open" data-k="${it.k}">
    <div class="nm"><b>${esc(it.n)}</b><small>${it.l===3?esc(it.k.split('.').slice(-1)[0])+' · ':''}${esc(it.i.map(i=>i.t).join(' | '))}</small></div>
    <div class="tg2">Target <b>${esc(tg)}</b></div>
    <div class="mini">${prog}</div>
    <span class="pill ${st}" style="justify-self:end">${r?STATUS_LABEL[st]:'Isi laporan'}</span></div>`;
}
function listHTML(){
  const {ok,show} = visibleSet();
  const progs = ITEMS.filter(x=>x.l===1 && show.has(x.k));
  if(!progs.length) return `<div class="card empty"><b>Tidak ada butir yang cocok</b>Ubah bidang, status, atau kata kunci pencarian.</div>`;
  return progs.map(p=>{
    const openP = !S.collapsed[p.k];
    const keg = ITEMS.filter(x=>x.l===2 && x.pk===p.k && show.has(x.k));
    const own = ok.has(p.k) ? rowHTML(p) : '';
    return `<section class="card grp"><div class="gh"><button class="tg" data-act="toggle" data-k="${p.k}" aria-expanded="${openP}" aria-label="Buka atau tutup ${esc(p.n)}">${ICON.chev}</button><div class="body"><div class="lv">Program ${esc(p.k)}</div><h3>${esc(p.n)}</h3></div></div>
      ${openP? (own + keg.map(k=>{
        const openK = !S.collapsed[k.k]; const subs = ITEMS.filter(x=>x.l===3 && x.kk===k.k && show.has(x.k));
        return `<div class="gh k"><button class="tg" data-act="toggle" data-k="${k.k}" aria-expanded="${openK}" aria-label="Buka atau tutup ${esc(k.n)}">${ICON.chev}</button><div class="body"><div class="lv">Kegiatan ${esc(k.k)}</div><h3>${esc(k.n)}</h3></div></div>
          ${openK? (ok.has(k.k)?rowHTML(k):'') + subs.map(rowHTML).join('') : ''}`;
      }).join('')) : ''}</section>`;
  }).join('');
}
function renderLapor(){
  const counts = {}; ITEMS.forEach(it=>{ if(isActive(it) && !isSent(rep(it.k,S.per))){ const b=bidangOf(it); counts[b]=(counts[b]||0)+1; }});
  const totalPend = Object.values(counts).reduce((a,b)=>a+b,0);
  const chips = `<button class="chip" data-act="bidang" data-v="all" aria-pressed="${S.bidang==='all'}">Semua bidang<em>${totalPend}</em></button>` +
    bidangList().map(b=>`<button class="chip" data-act="bidang" data-v="${b.id}" aria-pressed="${S.bidang===b.id}">${esc(bidangName(b.id))}<em>${counts[b.id]||0}</em></button>`).join('');
  return renderTop('Pelaporan kinerja','Pilih butir, isi realisasi, lampirkan tautan Google Drive, lalu kirim. '+twSub())+`
  ${S.tipOff?'':`<div class="tip"><div><b>Cara cepat melapor:</b> klik satu baris, isi realisasi (capaian terhitung otomatis), tempel tautan bukti dukung dari Google Drive, lalu pilih <b>Kirim laporan</b>. Centang <b>Lanjut ke butir berikutnya</b> agar laci langsung membuka butir yang belum dilaporkan.</div><button data-act="tip-off">Sembunyikan</button></div>`}
  <div class="card filters"><div class="chips" role="group" aria-label="Filter bidang">${chips}</div>
    <div class="frow"><input type="search" id="q" placeholder="Cari kode, kegiatan, atau indikator" value="${esc(S.q)}" aria-label="Cari">
    <select id="st" aria-label="Filter status"><option value="all">Semua status</option>${['belum','draft','terkirim','terverifikasi'].map(k=>`<option value="${k}" ${S.st===k?'selected':''}>${STATUS_LABEL[k]}</option>`).join('')}</select></div></div>
  <div class="list" id="list">${listHTML()}</div>`;
}

/* ---------- rekap ---------- */
function rekapRows(){
  return ITEMS.filter(it=> (S.rekapBidang==='all'||bidangOf(it)===S.rekapBidang) && (S.rekapLevel==='all'||String(it.l)===S.rekapLevel));
}
function linkList(r){ return (r&&r.l?r.l:[]).filter(l=>l.u); }
function renderRekap(){
  const rows = rekapRows().map(it=>{
    const r = rep(it.k,S.per); const p = pctOf(it,r); const ls_ = linkList(r); const eff = effInd(it);
    const real = eff.map((ind,i)=> r && r.r && r.r[i]!=null ? (fmt(r.r[i])+(ind.u==='%'?' %':' '+ind.u)) : '–').join('<br>');
    const pcs = eff.map((ind,i)=>{ const v=r&&r.r?r.r[i]:null; return v==null?'–':fmtPct(v/ind.v*100); }).join('<br>');
    const status = !isActive(it) ? '<span class="pill off">Tidak dilaksanakan</span>' : `<span class="pill ${r?r.s:''}">${STATUS_LABEL[r?r.s:'belum']}</span>`;
    return `<tr class="${it.l===1?'l1':''}"><td>${esc(it.k)}</td><td style="min-width:260px">${esc(it.n)}</td><td>${esc(bidangName(bidangOf(it)))}</td><td style="min-width:240px">${eff.map(i=>esc(i.t)).join('<br>')}</td><td class="num">${eff.map(tgtText).map(esc).join('<br>')}</td><td class="num">${real}</td><td class="num">${pcs}${eff.length>1?`<br><b>${fmtPct(p)}</b>`:''}</td><td>${status}</td><td>${ls_.map((l,i)=>`<a href="${esc(l.u)}" target="_blank" rel="noopener noreferrer">${esc(l.t||'Bukti '+(i+1))}</a>`).join('<br>')||'–'}</td><td>${esc(r?r.by:'')}</td><td>${esc(r?r.vc||'':'')}</td></tr>`;
  }).join('');
  return renderTop('Rekap laporan','Ringkasan seluruh butir untuk laporan akhir tahun anggaran 2026. '+twSub())+`
  <div class="card filters" style="position:static"><div class="frow">
    <select id="rb" aria-label="Filter bidang"><option value="all">Semua bidang</option>${bidangList().map(b=>`<option value="${b.id}" ${S.rekapBidang===b.id?'selected':''}>${esc(bidangName(b.id))}</option>`).join('')}</select>
    <select id="rl" aria-label="Filter tingkat"><option value="all">Semua tingkat</option>${[1,2,3].map(l=>`<option value="${l}" ${S.rekapLevel===String(l)?'selected':''}>${LEVEL[l]}</option>`).join('')}</select>
    <button class="btn" data-act="export" style="margin-left:auto">Unduh CSV</button></div></div>
  <div class="card tw-wrap" style="margin-top:14px"><table class="rk"><thead><tr><th>Kode</th><th>Program / kegiatan / sub kegiatan</th><th>Bidang</th><th>Indikator</th><th>Target</th><th>Realisasi</th><th>Capaian</th><th>Status</th><th>Bukti dukung</th><th>Pelapor</th><th>Catatan verifikasi</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function exportCSV(){
  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head = ['Kode','Tingkat','Uraian','Bidang','Indikator','Satuan','Target 2026','Realisasi','Capaian (%)','Status','Bukti dukung','Uraian capaian','Kendala dan tindak lanjut','Pelapor','Dikirim pada','Catatan verifikasi'];
  const lines = [head.map(q).join(',')];
  rekapRows().forEach(it=>{
    const r = rep(it.k,S.per); const eff = effInd(it);
    eff.forEach((ind,i)=>{
      const v = r&&r.r?r.r[i]:null;
      lines.push([it.k,LEVEL[it.l],it.n,bidangName(bidangOf(it)),ind.t,ind.u,ind.v,v==null?'':v,v==null?'':Math.round(v/ind.v*1000)/10,
        !isActive(it)?'Tidak dilaksanakan':STATUS_LABEL[r?r.s:'belum'],linkList(r).map(l=>l.u).join(' ; '),r?r.c:'',r?r.k:'',r?r.by:'',r?r.at:'',r?r.vc||'':''].map(q).join(','));
    });
  });
  const name = 'Rekap-Kinerja-Bapperida-2026.csv';
  downloadText(name, '\ufeff'+lines.join('\r\n'));
  toast('Rekap diunduh');
}

        <div><button type="button" class="btn sm" data-d="addlink" ${dis}>+ Tambah tautan</button></div></div>
      <div class="blk card"><h3>Keterangan</h3>
        <div class="fld"><label for="c">Uraian capaian</label><textarea id="c" class="in" data-d="c" placeholder="Apa yang sudah dilaksanakan pada periode ini" ${dis}>${esc(F.c)}</textarea></div>
        <div class="fld"><label for="kend">Kendala dan rencana tindak lanjut</label><textarea id="kend" class="in" data-d="kend" placeholder="Isi bila realisasi belum mencapai target" ${dis}>${esc(F.kend)}</textarea></div></div>
    </div>
    <div class="df"><div class="chk" id="chk"></div><div class="acts" id="acts"></div></div>`;
  renderLinks(); updateLive(); renderActs();
}
function syncDrawerMeta(){ /* status label dapat berubah karena penyimpanan; tidak menimpa isian */
  const el=$('#dstatus'); if(el && F){ const r=rep(F.kode,F.per); const s=r?r.s:null; if(s!==F.status){ F.status=s; el.className='pill '+(s||''); el.textContent=STATUS_LABEL[s||'belum']; renderActs(); } }
}
function renderDirtyBar(){
  const el=$('#dirty'); if(!el) return;
  el.innerHTML = F && F.pending ? `<div class="banner warn"><span>Perubahan belum disimpan.</span><div class="acts"><button class="btn sm" data-d="stay">Lanjut mengisi</button><button class="btn sm warn" data-d="discard">Buang perubahan</button></div></div>` : '';
}
function linkState(u){
  u=(u||'').trim(); if(!u) return {c:'',m:''};
  if(!/^https?:\/\//i.test(u)) return {c:'bad',m:'Tautan harus diawali https://'};
  if(!DRIVE_RE.test(u)) return {c:'bad',m:'Gunakan tautan Google Drive (drive.google.com atau docs.google.com).'};
  return {c:'ok',m:''};
}
function renderLinks(focusLast){
  const dis = locked() ? 'disabled' : '';
  $('#links').innerHTML = F.l.map((l,i)=>{ const st=linkState(l.u);
    return `<div class="lk" style="margin-bottom:10px"><input class="in ${st.c==='bad'?'bad':''}" data-d="lu" data-i="${i}" type="url" inputmode="url" placeholder="https://drive.google.com/…" value="${esc(l.u)}" aria-label="Tautan bukti dukung ${i+1}" ${dis}>
      <input class="in lt" data-d="lt" data-i="${i}" placeholder="Nama berkas (opsional)" value="${esc(l.t)}" aria-label="Nama berkas ${i+1}" ${dis}>
      <a class="ic" id="go${i}" href="${st.c==='ok'?esc(l.u):'#'}" target="_blank" rel="noopener noreferrer" aria-label="Buka tautan ${i+1}" aria-disabled="${st.c==='ok'?'false':'true'}">${ICON.open}</a>
      <button type="button" class="ic" data-d="rmlink" data-i="${i}" aria-label="Hapus tautan ${i+1}" ${dis}>${ICON.trash}</button>
      <div class="note r st" id="lm${i}">${esc(st.m)}</div></div>`; }).join('');
  if(focusLast){ const ins=$$('[data-d="lu"]'); if(ins.length) ins[ins.length-1].focus(); }
}
function calc(){
  const it=BY[F.kode]; const eff=effInd(it);
  const vals = it.i.map((_,i)=>{ const v=parseNum(F.r[i]); return isNaN(v)?null:v; });
  const ps = vals.map((v,i)=> v==null?null: (eff[i].v? v/eff[i].v*100 : 0));
  const filled = vals.every(v=>v!=null && v>=0);
  const all = ps.reduce((a,p)=>a+(p||0),0)/ps.length;
  return {vals,ps,filled,all,any:vals.some(v=>v!=null)};
}
function readiness(){
  const c=calc();
  const links=F.l.filter(l=>l.u.trim());
  const invalid=links.some(l=>linkState(l.u).c==='bad');
  const positive = c.vals.some(v=>v!=null && v>0);
  return { name: !!F.by.trim(), real: c.filled, links: !invalid && (!positive || links.length>0), invalid, needLink: positive && links.length===0 };
}
function updateLive(){
  const it=BY[F.kode]; const c=calc();
  it.i.forEach((ind,i)=>{
    const p=c.ps[i]; const b=band(p);
    const bar=$('#bar'+i), pc=$('#pc'+i), h=$('#hint'+i); if(!bar) return;
    bar.className=b; bar.style.width=Math.min(100,p||0)+'%'; pc.textContent=fmtPct(p);
    let msg='', cls='note';
    const v=c.vals[i];
    if(v!=null && v<0){ msg='Angka tidak boleh negatif.'; cls='note r'; }
    else if(F.r[i] && v==null){ msg='Angka belum terbaca. Gunakan digit dan koma untuk desimal.'; cls='note r'; }
    else if(p!=null && p>150){ msg='Melampaui 150% dari target. Pastikan angka sudah benar dan jelaskan pada keterangan.'; cls='note w'; }
    else if(p!=null && p>100){ msg='Melampaui target.'; }
    h.className=cls; h.textContent=msg;
  });
  const anyV=c.any; const pa = anyV ? c.all : null;
  $('#pcAll').textContent = fmtPct(pa); $('#barAll').className=band(pa); $('#barAll').style.width=Math.min(100,pa||0)+'%';
  $('#labAll').textContent = BAND_LABEL[band(pa)];
  const rd=readiness();
  $('#chk').innerHTML = `<span class="${rd.name?'y':''}">Nama pelapor</span><span class="${rd.real?'y':''}">Semua realisasi terisi</span><span class="${rd.links?'y':''}">${rd.invalid?'Tautan tidak valid':'Bukti dukung'}</span>`;
}
function renderActs(){
  const el=$('#acts'); if(!el||!F) return;
  const st=F.status;
  if(st==='terverifikasi'){ el.innerHTML = '<button class="btn" data-d="close">Tutup</button>'; return; }
  const nx = `<label class="nx"><input type="checkbox" data-d="next" ${F.next?'checked':''}>Lanjut ke butir berikutnya</label>`;
  el.innerHTML = nx
    + (st==='terkirim' ? '' : '<button class="btn" data-d="draft">Simpan draft</button>')
    + `<button class="btn pri" data-d="send">${st==='terkirim'?'Perbarui laporan':'Kirim laporan'}</button>`;
}
function markDirty(){ F.dirty=true; if(F.pending){ F.pending=null; renderDirtyBar(); } }
function nextTarget(){
  const {ok} = visibleSet();
  const list = ITEMS.filter(x=>ok.has(x.k) && isActive(x));
  const idx = list.findIndex(x=>x.k===F.kode);
  const order = list.slice(idx+1).concat(list.slice(0,Math.max(idx,0)));
  return order.find(x=>!isSent(rep(x.k,F.per)));
}
async function commit(kind){
  const it=BY[F.kode]; const c=calc(); const rd=readiness();
  const miss=[];
  if(!rd.name) miss.push('nama pelapor');
  if(kind!=='draft'){
    if(!rd.real) miss.push('realisasi setiap indikator');
    if(rd.invalid) miss.push('tautan Google Drive yang valid'); else if(rd.needLink) miss.push('minimal satu tautan bukti dukung');
  }
  if(miss.length){
    toast('Lengkapi dahulu: '+miss.join(', ')+'.');
    if(!rd.name){ $('#by').classList.add('bad'); $('#by').focus(); }
    else if(!rd.real){ const i=c.vals.findIndex(v=>v==null); const e=$('#r'+Math.max(i,0)); if(e) e.focus(); }
    else { const e=$('[data-d="lu"]'); if(e) e.focus(); }
    return;
  }
  ls.set('pelapor',F.by.trim()); ls.set('lanjut',F.next?'1':'0');
  const old = rep(it.k,F.per);
  const r = { r:c.vals, l:F.l.filter(l=>l.u.trim()).map(l=>({u:l.u.trim(),t:l.t.trim()})), c:F.c.trim(), k:F.kend.trim(),
    s: kind==='draft'?'draft':'terkirim', by:F.by.trim(), at:new Date().toISOString() };
  const kode=F.kode, per=F.per, wantNext=F.next;
  const nxt = wantNext && kind!=='draft' ? nextTarget() : null;
  try{
    await saveRep(kode,per,r);
  }catch(e){ toast('Laporan belum tersimpan. Periksa koneksi lalu coba lagi.'); return; }
  toast(kind==='draft'?'Draft disimpan':(old&&old.s==='terkirim'?'Laporan diperbarui':'Laporan terkirim'));
  F.dirty=false;
  if(nxt){ closeDrawer(true); openItem(nxt.k); } else closeDrawer(true);
}
async function toggleVerify(kode,on){
  const old=rep(kode,S.per); if(!old) return;
  const r=clone(old);
  if(on){ r.s='terverifikasi'; r.vb='Admin'; r.va=new Date().toISOString(); }
  else { r.s='terkirim'; delete r.vb; delete r.va; }
  try{ await saveRep(kode,S.per,r); toast(on?'Laporan diverifikasi':'Verifikasi dibatalkan'); }catch(e){ toast('Perubahan belum tersimpan.'); }
}
async function saveNote(kode){
  const el = document.querySelector('[data-note="'+kode+'"]'); if(!el) return;
  const old=rep(kode,S.per); if(!old) return;
  const r=clone(old); r.vc=el.value.trim();
  try{ await saveRep(kode,S.per,r); toast('Catatan disimpan'); }catch(e){ toast('Catatan belum tersimpan'); }
}

/* ---------- event ---------- */
document.addEventListener('click', e=>{
  const dEl = e.target.closest('[data-d]');
  if(dEl && F && $('#drawer').contains(dEl)){
    const a=dEl.dataset.d; const i=+dEl.dataset.i; const it=BY[F.kode];
    if(a==='close') closeDrawer();
    else if(a==='stay'){ F.pending=null; renderDirtyBar(); }
    else if(a==='discard') closeDrawer(true);
    else if(a==='step'){ const cur=parseNum(F.r[i]); const base=isNaN(cur)?0:cur; const nv=Math.max(0,Math.round((base+ +dEl.dataset.s)*100)/100); F.r[i]=numStr(nv); $('#r'+i).value=F.r[i]; markDirty(); updateLive(); }
    else if(a==='fill'){ F.r[i]=numStr(effInd(it)[i].v); $('#r'+i).value=F.r[i]; markDirty(); updateLive(); }
    else if(a==='addlink'){ F.l.push({u:'',t:''}); markDirty(); renderLinks(true); }
    else if(a==='rmlink'){ F.l.splice(i,1); if(!F.l.length) F.l.push({u:'',t:''}); markDirty(); renderLinks(); updateLive(); }
    else if(a==='draft') commit('draft');
    else if(a==='send') commit('send');
    return;
  }
  const t = e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act;
  if(a==='nav'){ S.view=t.dataset.v; refresh(); window.scrollTo({top:0}); }
  else if(a==='bidang'){ S.bidang=t.dataset.v; refresh(); }
  else if(a==='open'){ openItem(t.dataset.k); }
  else if(a==='toggle'){ const k=t.dataset.k; S.collapsed[k]=!S.collapsed[k]; $('#list').innerHTML=listHTML(); }
  else if(a==='goto-lapor'){ S.view='lapor'; S.bidang='all'; S.st='belum'; refresh(); window.scrollTo({top:0}); }
  else if(a==='tip-off'){ S.tipOff=true; ls.set('tipOff','1'); refresh(); }
  else if(a==='export'){ exportCSV(); }
  else if(a==='reset-map'){ S.cfg.map={}; saveCfg().then(()=>toast('Pemetaan dikembalikan ke awal')); }
  else if(a==='reset-target'){ const k=t.dataset.k, i=+t.dataset.i;
    if(S.cfg.targets && S.cfg.targets[k]){ delete S.cfg.targets[k][i]; if(!S.cfg.targets[k].some(Boolean)) delete S.cfg.targets[k]; }
    saveCfg().then(()=>toast('Target dikembalikan ke Renja awal')); }
  else if(a==='login'){
    const pw=$('#pw'); const ok = pw && checkPass(pw.value);
    if(ok){ S.isAdmin=true; ls.set('isAdmin','1'); refresh(); toast('Berhasil masuk sebagai admin'); }
    else { const er=$('#loginerr'); if(er) er.textContent='Kata sandi salah.'; if(pw){ pw.classList.add('bad'); pw.focus(); } }
  }
  else if(a==='admintab'){ S.adminTab=t.dataset.v; refresh(); }
  else if(a==='logout'){ S.isAdmin=false; ls.set('isAdmin','0'); S.view='dashboard'; refresh(); }
  else if(a==='save-note'){ saveNote(t.dataset.k); }
  else if(a==='ver-toggle'){ toggleVerify(t.dataset.k, t.dataset.v==='1'); }
  else if(a==='save-pass'){
    const p1=$('#np1'), p2=$('#np2');
    if(!p1.value.trim()){ toast('Isi kata sandi baru terlebih dahulu'); p1.focus(); return; }
    if(p1.value!==p2.value){ toast('Kata sandi baru tidak sama'); p2.focus(); return; }
    S.cfg.pass = p1.value.trim();
    saveCfg().then(()=>toast('Kata sandi admin diperbarui')).catch(()=>toast('Kata sandi belum tersimpan'));
  }
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.id==='q'){ S.q=el.value; $('#list').innerHTML=listHTML(); return; }
  const d=el.dataset && el.dataset.d; if(!d||!F) return;
  const i=+el.dataset.i;
  if(d==='real'){ F.r[i]=el.value; markDirty(); updateLive(); }
  else if(d==='by'){ F.by=el.value; el.classList.remove('bad'); markDirty(); updateLive(); }
  else if(d==='c'){ F.c=el.value; markDirty(); }
  else if(d==='kend'){ F.kend=el.value; markDirty(); }
  else if(d==='lu'){ F.l[i].u=el.value; const st=linkState(el.value); el.classList.toggle('bad',st.c==='bad'); const m=$('#lm'+i); if(m) m.textContent=st.m; const g=$('#go'+i); if(g){ g.href=st.c==='ok'?el.value.trim():'#'; g.setAttribute('aria-disabled',st.c==='ok'?'false':'true'); } markDirty(); updateLive(); }
  else if(d==='lt'){ F.l[i].t=el.value; markDirty(); }
});
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.id==='db'){ S.dashBidang=el.value; refresh(); }
  else if(el.id==='st'){ S.st=el.value; $('#list').innerHTML=listHTML(); }
  else if(el.id==='rb'){ S.rekapBidang=el.value; refresh(); }
  else if(el.id==='rl'){ S.rekapLevel=el.value; refresh(); }
  else if(el.dataset && el.dataset.d==='next' && F){ F.next=el.checked; }
  else if(el.dataset && el.dataset.map){ const k=el.dataset.map; const it=BY[k]; const def = it.b;
    if(el.value===def) delete S.cfg.map[k]; else S.cfg.map[k]=el.value;
    saveCfg().then(()=>toast('Pemetaan disimpan')).catch(()=>toast('Pemetaan belum tersimpan')); }
  else if(el.dataset && el.dataset.name){ const id=el.dataset.name; const v=el.value.trim(); const def=(BIDANG0.find(b=>b.id===id)||{}).n;
    if(!v||v===def) delete S.cfg.names[id]; else S.cfg.names[id]=v;
    saveCfg().then(()=>toast('Nama bidang disimpan')).catch(()=>toast('Nama bidang belum tersimpan')); }
  else if(el.dataset && el.dataset.tgt){
    const k=el.dataset.tgt, i=+el.dataset.i, f=el.dataset.f;
    S.cfg.targets = S.cfg.targets||{}; S.cfg.targets[k]=S.cfg.targets[k]||[]; S.cfg.targets[k][i]=S.cfg.targets[k][i]||{};
    if(f==='v'){ const n=parseNum(el.value); S.cfg.targets[k][i].v = isNaN(n)?null:n; }
    else { S.cfg.targets[k][i].u = el.value.trim(); }
    saveCfg().then(()=>toast('Target diperbarui')).catch(()=>toast('Target belum tersimpan'));
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='pw'){ e.preventDefault(); const b=document.querySelector('[data-act="login"]'); if(b) b.click(); return; }
  if(e.key==='Escape' && F){ closeDrawer(); return; }
  if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('row') && e.target.dataset.act==='open'){ e.preventDefault(); openItem(e.target.dataset.k); }
  if(e.key==='Enter' && e.target.dataset && (e.target.dataset.d==='real') && F){ e.preventDefault(); const i=+e.target.dataset.i; const nx=$('#r'+(i+1)); if(nx) nx.focus(); else { const l=$('[data-d="lu"]'); if(l) l.focus(); } }
});
$('#veil').addEventListener('click', ()=>closeDrawer());
/* keterangan kotak papan capaian */
function tipFor(k){
  const it=BY[k]; const r=rep(k,S.per); const p=pctOf(it,r);
  if(!r) return `<b>${esc(it.k)}</b> ${esc(it.n)} · belum dilaporkan`;
  return `<b>${esc(it.k)}</b> ${esc(it.n)} · capaian <b>${fmtPct(p)}</b> (${BAND_LABEL[band(p)].toLowerCase()}) · ${STATUS_LABEL[r.s].toLowerCase()}`;
}
document.addEventListener('mouseover', e=>{ const t=e.target.closest('[data-tip]'); const ro=$('#readout'); if(t&&ro) ro.innerHTML=tipFor(t.dataset.k); });
document.addEventListener('focusin', e=>{ const t=e.target.closest && e.target.closest('[data-tip]'); const ro=$('#readout'); if(t&&ro) ro.innerHTML=tipFor(t.dataset.k); });

/* ---------- mulai ---------- */
renderRail(); renderMain();
initStore();
})();

</script>
